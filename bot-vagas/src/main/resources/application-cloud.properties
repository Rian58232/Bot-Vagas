# Scraper Configuration
botvagas.scraper.cargo=Engenharia de Software
botvagas.scraper.localizacao=Brasil
botvagas.scraper.incluir-remoto=true
botvagas.scraper.incluir-presencial=true
botvagas.scraper.url-base=https://br.indeed.com/empregos?q=
botvagas.scraper.maximo-vagas=15
botvagas.scraper.timeout-ms=20000

# Scheduler
botvagas.scheduler.executar-ao-iniciar=true
botvagas.scheduler.delay-ao-iniciar-ms=15000
botvagas.scheduler.cron=0 0 9,18 * * *

# WhatsApp Web + Selenium (configuração pra nuvem)
botvagas.whatsapp.grupo-nome=Bot Vagas
botvagas.whatsapp.web-url=https://web.whatsapp.com/
botvagas.whatsapp.navegador=chrome
botvagas.whatsapp.driver-path=/app/chromedriver
botvagas.whatsapp.binario-path=/usr/bin/google-chrome
botvagas.whatsapp.diretorio-navegador=/app/.botvagas/whatsapp/browser
botvagas.whatsapp.timeout-login-segundos=300
botvagas.whatsapp.timeout-elementos-segundos=30
botvagas.whatsapp.tempo-estabilizacao-conexao-ms=5000
botvagas.whatsapp.auto-start=true
botvagas.whatsapp.headless=false

# Spring
spring.application.name=bot-vagas-whatsapp
server.port=${PORT:8080}

# Logging
logging.level.root=INFO
logging.level.com.botvagas=INFO
logging.level.org.springframework=WARN
